<section>
  <div class="datetime-title">
    <h2 mat-dialog-title>Editar Fecha y Hora del Sistema</h2>
  </div>
  
  <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="Date" [disabled]="loading()">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>Hora</mat-label>
        <input matInput type="time" [(ngModel)]="Time" [disabled]="loading()">
      </mat-form-field>
      
      @if (error()) {
        <div class="error-message">
          {{ error() }}
        </div>
      }
      @if (success()) {
        <div class="success-message">
          {{ success() }}
        </div>
      }
  </mat-card-content>
  
  <mat-card-footer>
    <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="loading()">
      {{ loading() ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-card-footer>
</section>
