<div class="filter-dialog">
  <h2 mat-dialog-title>Filtrar Historial por Fecha</h2>
  <mat-dialog-content>
    <form [formGroup]="filterForm" class="filter-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha de Inicio</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
        <mat-hint>Dejar vacío para incluir desde el inicio</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha de Fin</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
        <mat-hint>Dejar vacío para incluir hasta hoy</mat-hint>
      </mat-form-field>

      @if(filterForm.hasError('dateRange')) {
        <div class="error-message">
          La fecha de inicio debe ser anterior a la fecha de fin
        </div>
      }

      <div class="quick-filters">
        <h3>Filtros Rápidos</h3>
        <div class="quick-filter-buttons">
          <button mat-button type="button" (click)="setLastWeek()">
            Última Semana
          </button>
          <button mat-button type="button" (click)="setLastMonth()">
            Último Mes
          </button>
          <button mat-button type="button" (click)="setLastThreeMonths()">
            Últimos 3 Meses
          </button>
          <button mat-button type="button" (click)="clearDates()">
            Limpiar
          </button>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="applyFilter()" 
      [disabled]="filterForm.invalid">
      Aplicar Filtro
    </button>
  </mat-dialog-actions>
</div>
