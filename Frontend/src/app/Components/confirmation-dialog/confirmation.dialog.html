<section mat-dialog-container>
  <h2 mat-dialog-title>{{ title }}</h2>
  <mat-dialog-content>
    <p>{{ message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions >
    <button mat-button cdkFocusInitial (click)="onCancel()">Cancelar</button>
    <button mat-button color="primary" (click)="onConfirm()">Confirmar</button>
  </mat-dialog-actions>
</section>
