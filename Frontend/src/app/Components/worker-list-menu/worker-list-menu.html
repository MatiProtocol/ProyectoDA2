<app-side-nav-bar>
  @if (!loading()) {
	@if (error()) {
		<div class="error">
			{{ error() }}
		</div>
	} @else {
    <div class="table-header">
      <h2>Lista de Trabajadores</h2>
      <button mat-raised-button color="primary" (click)="LoadData()">
        <mat-icon aria-hidden="false" aria-label="refresh icon" fontIcon="refresh" ></mat-icon>
        Refrescar
      </button>
    </div>
    <div class="create-worker-button">
      <button mat-raised-button (click)="openWorkerDialog()">
        <mat-icon aria-hidden="false" aria-label="add icon" fontIcon="add" ></mat-icon>
        Registrar Trabajador
      </button>
    </div>
    <div class="table-body">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 full-width-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let element">{{ element.email }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Roles</th>
          <td mat-cell *matCellDef="let element">{{ element.roles }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
              @if(isRole('ParkAdmin') && !isCurrentUser(element.email)) {
              <button mat-icon-button aria-label="delete" (click)="deleteWorker(element.id)">
                <mat-icon>person_remove</mat-icon>
              </button>
            }
            @if(isRole('ParkAdmin')) {
              <button mat-icon-button aria-label="delete" (click)="configWorkerDialog(element.id)">
                <mat-icon>engineering</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" [attr.id]="row.id"></tr>
      </table>
    </div>
	}
} @else {
	<div class="loading-state">
		<mat-spinner diameter="40"></mat-spinner>
		<span>Cargando atracciones</span>
	</div>
}
</app-side-nav-bar>
