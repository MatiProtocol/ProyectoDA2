services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: VirtualPark-sqlserver
    environment:
      SA_PASSWORD: "Password1"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - ./data:/var/opt/mssql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
